name: deploy-hfs-formal

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character GitHub main commit to deploy
        required: true
        type: string
      confirm_upload:
        description: Type PUBLISH_FORMAL to authorize the canonical Space write and factory restart
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qwenpaw-hfs-formal-deploy
  cancel-in-progress: false

env:
  FORMAL_SPACE: BlueSkyXN/QwenPaw-all-in-one-HFS
  HF_CLI_VERSION: "1.5.0"
  HF_CLI_CLICK_VERSION: "8.3.1"

jobs:
  deploy-formal:
    runs-on: ubuntu-24.04
    environment: hfs-production
    steps:
      - name: Check out the requested immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Authorize an exact GitHub main formal release
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRM_UPLOAD" == "PUBLISH_FORMAL" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$SOURCE_REF" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_REF" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Run the no-secret repository gate
        shell: bash
        run: bash scripts/static-check.sh

      - name: Export and verify the formal Space bundle
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/export_hfs_space_bundle.py export \
            --source-commit "$SOURCE_REF" \
            --profile formal \
            --output "$RUNNER_TEMP/qwenpaw-formal-bundle"
          python3 scripts/export_hfs_space_bundle.py verify \
            --profile formal \
            --bundle "$RUNNER_TEMP/qwenpaw-formal-bundle"

      - name: Install the pinned Hugging Face client
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check \
            "huggingface_hub==${HF_CLI_VERSION}" \
            "click==${HF_CLI_CLICK_VERSION}"
          python3 -m huggingface_hub.cli.hf version
          python3 -m huggingface_hub.cli.hf --help >/dev/null
          python3 -m huggingface_hub.cli.hf upload --help >/dev/null
          python3 -m huggingface_hub.cli.hf download --help >/dev/null

      - name: Require the existing private canonical Space and a strict path set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN environment Secret is required." >&2; exit 1; }
          python3 scripts/export_hfs_space_bundle.py paths --profile formal > "$RUNNER_TEMP/qwenpaw-formal-paths"
          python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          from huggingface_hub import HfApi

          space = os.environ["FORMAL_SPACE"]
          token = os.environ["HF_TOKEN"]
          expected = set(Path(os.environ["RUNNER_TEMP"], "qwenpaw-formal-paths").read_text().splitlines())
          api = HfApi(token=token)
          try:
              info = api.space_info(space, revision="main", token=token)
              actual = set(
                  api.list_repo_files(space, revision="main", repo_type="space", token=token)
              )
          except Exception as exc:
              raise SystemExit(
                  f"Canonical Space preflight failed without exposing response details: {type(exc).__name__}"
              ) from None
          if info.private is not True:
              raise SystemExit("Canonical Space must already exist with private=true.")
          if actual - expected:
              raise SystemExit(
                  "Canonical Space contains a path outside the verified formal allowlist; "
                  "this workflow never deletes remote files."
              )
          print(f"Private canonical preflight passed with {len(actual)} allowlisted remote paths.")
          PY

      - name: Reconfirm exact GitHub main immediately before upload
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == "$SOURCE_REF" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]]
          [[ "$(git rev-parse origin/main)" == "$SOURCE_REF" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Upload only the verified formal bundle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m huggingface_hub.cli.hf upload \
            "$FORMAL_SPACE" \
            "$RUNNER_TEMP/qwenpaw-formal-bundle" \
            . \
            --repo-type space \
            --revision main \
            --commit-message "Deploy verified GitHub main formal bundle ${SOURCE_REF}"

      - name: Read back provenance and request a factory restart
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/qwenpaw-formal-bundle"
          readback="$RUNNER_TEMP/qwenpaw-formal-readback"
          python3 scripts/export_hfs_space_bundle.py paths --profile formal > "$RUNNER_TEMP/qwenpaw-formal-paths"
          python3 -m huggingface_hub.cli.hf download \
            "$FORMAL_SPACE" \
            --repo-type space \
            --revision main \
            --local-dir "$readback" >/dev/null
          READBACK="$readback" python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          shutil.rmtree(Path(os.environ["READBACK"], ".cache"), ignore_errors=True)
          PY
          python3 scripts/export_hfs_space_bundle.py verify \
            --profile formal \
            --bundle "$readback"
          cmp "$bundle/BUILD_SOURCE.json" "$readback/BUILD_SOURCE.json"
          cmp "$bundle/SHA256SUMS" "$readback/SHA256SUMS"
          READBACK="$readback" python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          from huggingface_hub import HfApi

          readback = Path(os.environ["READBACK"])
          expected = set(Path(os.environ["RUNNER_TEMP"], "qwenpaw-formal-paths").read_text().splitlines())
          evidence = json.loads((readback / "BUILD_SOURCE.json").read_text(encoding="utf-8"))
          if evidence.get("wrapper_source_commit") != os.environ["SOURCE_REF"]:
              raise SystemExit("Formal readback provenance does not match the authorized GitHub main SHA.")
          if evidence.get("target_space") != os.environ["FORMAL_SPACE"] or evidence.get("profile") != "formal":
              raise SystemExit("Formal readback provenance does not identify the fixed canonical profile.")

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          try:
              info = api.space_info(os.environ["FORMAL_SPACE"], revision="main", token=token)
              actual = set(
                  api.list_repo_files(
                      os.environ["FORMAL_SPACE"], revision="main", repo_type="space", token=token
                  )
              )
              if info.private is not True:
                  raise SystemExit("Canonical Space is no longer private.")
              if actual != expected:
                  raise SystemExit("Canonical repository readback does not exactly match the formal allowlist.")
              api.restart_space(os.environ["FORMAL_SPACE"], factory_reboot=True)
          except SystemExit:
              raise
          except Exception as exc:
              raise SystemExit(
                  f"Formal readback or factory restart failed without exposing response details: {type(exc).__name__}"
              ) from None
          print(f"Formal readback passed for {len(actual)} files; factory restart requested.")
          PY

      - name: Record the remaining runtime acceptance gates
        shell: bash
        run: |
          cat <<'EOF'
          Formal repository upload, exact bundle/provenance readback, and factory restart request succeeded.
          This workflow does not sync Space Settings or volumes. Runtime takeover, live/authenticated
          smoke, existing-account persistence, backup, and restore remain separate acceptance gates.
          EOF
