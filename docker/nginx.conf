worker_processes  1;
pid /tmp/qwenpaw-run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  client_body_temp_path /tmp/qwenpaw-run/nginx-client-body;
  proxy_temp_path       /tmp/qwenpaw-run/nginx-proxy;
  fastcgi_temp_path     /tmp/qwenpaw-run/nginx-fastcgi;
  uwsgi_temp_path       /tmp/qwenpaw-run/nginx-uwsgi;
  scgi_temp_path        /tmp/qwenpaw-run/nginx-scgi;

  sendfile on;
  keepalive_timeout 65;
  absolute_redirect off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream qwenpaw_app {
    server 127.0.0.1:8088;
  }

  upstream qwenpaw_ops {
    server 127.0.0.1:8081;
  }

  upstream qwenpaw_admin {
    server 127.0.0.1:8082;
  }

  server {
    listen 7860 default_server;
    listen [::]:7860 default_server;
    server_name _;
    client_max_body_size 100M;

    location = /nginx-health {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /healthz {
      proxy_pass http://qwenpaw_ops/healthz;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
      proxy_pass http://qwenpaw_ops/readyz;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_ops {
      return 308 /_ops/$is_args$args;
    }

    location /_ops/ {
      client_max_body_size 16k;
      limit_except GET {
        deny all;
      }
      proxy_pass http://qwenpaw_ops;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_admin {
      return 308 /_admin/$is_args$args;
    }

    location /_admin/ {
      client_max_body_size 64k;
      limit_except GET POST {
        deny all;
      }
      proxy_pass http://qwenpaw_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://qwenpaw_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600;
      proxy_send_timeout 3600;
    }
  }
}
