[supervisord]
nodaemon=true
logfile=/data/var/logs/supervisord.log
pidfile=/tmp/qwenpaw-run/supervisord.pid
childlogdir=/data/var/logs

[unix_http_server]
file=/tmp/qwenpaw-run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/qwenpaw-run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
autostart=true
autorestart=true
priority=10
stdout_logfile=/data/var/logs/xvfb.log
stderr_logfile=/data/var/logs/xvfb.err.log

[program:qwenpaw]
command=/usr/bin/dbus-run-session -- qwenpaw app --host 127.0.0.1 --port %(ENV_QWENPAW_PORT)s
autostart=true
autorestart=true
priority=30
environment=DISPLAY=":99",QWENPAW_RUNNING_IN_CONTAINER="1",PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="/usr/bin/chromium",PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD="1"
stdout_logfile=/data/var/logs/qwenpaw.log
stderr_logfile=/data/var/logs/qwenpaw.err.log

[program:nginx]
command=/usr/sbin/nginx -c /home/user/app/docker/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
priority=40
stdout_logfile=/data/var/logs/nginx.log
stderr_logfile=/data/var/logs/nginx.err.log

[program:ops-service]
command=python /home/user/app/docker/ops_service.py
autostart=true
autorestart=true
priority=50
stdout_logfile=/data/var/logs/ops-service.log
stderr_logfile=/data/var/logs/ops-service.err.log

[program:admin-service]
command=python /home/user/app/docker/admin_service.py
autostart=true
autorestart=true
priority=60
stdout_logfile=/data/var/logs/admin-service.log
stderr_logfile=/data/var/logs/admin-service.err.log
