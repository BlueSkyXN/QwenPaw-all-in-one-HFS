standard = "3.0"
project = "qwenpaw-all-in-one-hfs"
space = "BlueSkyXN/QwenPaw-all-in-one-HFS"
project_class = "preview"
target_role = "primary"
space_visibility = "protected"
bucket_visibility = "private"
sovereignty = "port"
lane = "source"
version_source = "commit"
env_file = ".env"

# Values stay in the ignored local .env ledger; these names are never synced to Space.
local_only = [
  "GH_TOKEN",
  "HF_TOKEN",
  "GH_REPO",
  "HF_SPACE_ID",
  "HF_SPACE_URL",
  "HF_PUBLIC_URL",
  "HF_STORAGE_BUCKET",
  "SMOKE_BASE_URL",
  "ADMIN_EXPECTED_ENABLED",
  "SMOKE_ADMIN_ACTIONS",
]

# Values are configured as Hugging Face Space Secrets.
secrets = [
  "OPS_TOKEN",
]

# Values are optional Hugging Face Space Secrets. Non-empty local values are synced.
# A remote-only optional Secret is drift: recover its local value or prune it explicitly.
optional_secrets = [
  "ADMIN_PASSWORD",
  "ADMIN_CSRF_TOKEN",
  "DASHSCOPE_API_KEY",
  "OPENAI_API_KEY",
  "GEMINI_API_KEY",
  "TELEGRAM_BOT_TOKEN",
  "DISCORD_BOT_TOKEN",
]

# Values are configured as Hugging Face Space Variables.
variables = [
  "ADMIN_USERNAME",
  "PORT",
  "QWENPAW_PORT",
  "QWENPAW_WORKING_DIR",
  "QWENPAW_SECRET_DIR",
  "QWENPAW_BACKUP_DIR",
  "QWENPAW_DISABLED_CHANNELS",
  "QWENPAW_AUTH_ENABLED",
  "QWENPAW_TELEMETRY_OPT_OUT",
  "ADMIN_ENABLED",
  "QWENPAW_OPS_PORT",
  "QWENPAW_ADMIN_PORT",
  "QWENPAW_OPS_LOG_DIR",
  "QWENPAW_ADMIN_AUDIT_LOG",
  "OPS_SESSION_TTL_SECONDS",
  "OPS_COOKIE_SECURE",
]
