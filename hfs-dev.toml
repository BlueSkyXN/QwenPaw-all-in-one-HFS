schema_version = 2
standard = "hfs-dev"
pattern = "A"
runtime_mode = "source-fetch"
space_root_mode = "repo-root"
hfs_dir = "."
public_port = 7860
internal_app_port = 8088
canonical_health_endpoint = "/healthz"
readiness_endpoint = "/readyz"
release_pin_required = true
required_files = [
  "README.md",
  "Dockerfile",
  "docker",
  "scripts",
  "docs",
  "AGENTS.md",
]

[[release_pins]]
name = "BASE_IMAGE_REF"
type = "image_ref"
source = "Dockerfile ARG"
required_for_release = true
dev_mutable_default_allowed = true
release_requires_digest = true
description = "Release builds must use an immutable base image digest."

[[release_pins]]
name = "QWENPAW_SOURCE_REPO"
type = "metadata"
source = "Dockerfile ARG"
required_for_release = true
dev_mutable_default_allowed = true
description = "Upstream QwenPaw Git repository fetched during Docker build."

[[release_pins]]
name = "QWENPAW_SOURCE_REF"
type = "git_ref"
source = "Dockerfile ARG"
required_for_release = true
dev_mutable_default_allowed = true
release_requires_commit_sha = true
description = "Upstream QwenPaw commit SHA fetched and installed from source during Docker build."

[[release_pins]]
name = "QWENPAW_SOURCE_VERSION"
type = "package_version"
source = "Dockerfile ARG"
required_for_release = true
dev_mutable_default_allowed = false
description = "Expected qwenpaw.__version__ value in the pinned upstream source tree."

[[release_pins]]
name = "UV_VERSION"
type = "package_version"
source = "Dockerfile ARG"
required_for_release = true
dev_mutable_default_allowed = true
description = "uv version used for source package installation."
