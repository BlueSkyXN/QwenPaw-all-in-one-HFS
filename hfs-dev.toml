schema_version = 2
standard = "hfs-dev"
pattern = "A"
runtime_mode = "artifact-at-build-time"
space_root_mode = "repo-root"
hfs_dir = "."
public_port = 7860
internal_app_port = 8088
canonical_health_endpoint = "/healthz"
readiness_endpoint = "/readyz"
release_pin_required = true
required_files = [
  "README.md",
  "Dockerfile",
  "docker",
  "scripts",
  "docs",
  "AGENTS.md",
]

[[release_pins]]
name = "BASE_IMAGE_REF"
type = "image_ref"
source = "Dockerfile ARG"
required_for_release = true
dev_mutable_default_allowed = true
release_requires_digest = true
description = "Release builds must use an immutable base image digest."

[[release_pins]]
name = "QWENPAW_VERSION"
type = "package_version"
source = "Dockerfile ARG"
required_for_release = true
dev_mutable_default_allowed = false
description = "QwenPaw package version selected at build time."

[[release_pins]]
name = "QWENPAW_PACKAGE_SHA256"
type = "checksum"
source = "Dockerfile ARG / release checklist"
required_for_release = true
dev_mutable_default_allowed = false
release_requires_checksum = true
description = "SHA256 for the qwenpaw package artifact selected by QWENPAW_VERSION."

[[release_pins]]
name = "UV_VERSION"
type = "package_version"
source = "Dockerfile ARG"
required_for_release = true
dev_mutable_default_allowed = true
description = "uv version used for package installation."

[[release_pins]]
name = "QWENPAW_UPSTREAM_REF"
type = "metadata"
source = "Dockerfile ARG / release record"
required_for_release = false
dev_mutable_default_allowed = true
metadata_only = true
description = "Human-readable upstream repository commit or tag for audit only."
